name: release

# Build the single-file `presik` binary for each OS, smoke-test it, and publish
# it to a GitHub Release. Runs on a version tag (v*) — or manually to just build
# and upload Actions artifacts. GitHub's setup-node provides official Node
# builds (which carry the SEA fuse), so build.js uses them directly.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create/upload the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: presik-linux-x64
          - os: macos-latest
            asset: presik-macos-arm64
          - os: windows-latest
            asset: presik-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - run: npm run smoke # never ship a binary that doesn't serve
      - name: Name the binary per platform
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then cp dist/presik.exe "${{ matrix.asset }}.exe"; else cp dist/presik "${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*
          if-no-files-found: error
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" ${{ matrix.asset }}* --clobber

  # Publish the npm package (the source that runs via `npx presik`) to GitHub
  # Packages — only once every platform's binary has built and smoke-passed, and
  # only on a version tag. package.json keeps `private: true` as a guard against
  # an accidental npmjs publish; here we drop it and scope the name to the owner,
  # which GitHub Packages requires. The binaries themselves go to the Release
  # above; this is the installable `@<owner>/presik` for `npm i` / `npx`.
  publish-package:
    name: Publish package to GitHub Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
      - name: Prepare package for GitHub Packages
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          npm pkg delete private
          npm pkg set name="@${owner}/presik"
          # Keep the published version in lockstep with the release tag (v1.2.3 → 1.2.3).
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
