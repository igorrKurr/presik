name: release

# Cut a release automatically. Bump "version" in package.json and push to main
# → this workflow tags v<version>, builds the single-file binary for each OS,
# smoke-tests it, attaches the binaries to a GitHub Release, and publishes the
# npm package to GitHub Packages. Pushing a v* tag by hand, or running this
# manually (workflow_dispatch), does the same for the current version.
#
# The tag is created inside the `gate` job of THIS run — a tag pushed by the
# built-in GITHUB_TOKEN does not trigger another workflow, so we don't rely on
# the tag re-triggering; the whole chain runs here.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # tag the repo + create/upload the GitHub Release

jobs:
  # Decide whether this push should release, and on what tag. Auto-releases only
  # when the push actually changed package.json's version (so ordinary commits to
  # main don't cut releases); a manual run or a pushed tag always releases.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD + HEAD~1, to see if this push changed the version
      - id: decide
        shell: bash
        run: |
          set -euo pipefail

          # A hand-pushed tag releases exactly that tag.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cur=$(node -p "require('./package.json').version")
          tag="v${cur}"

          # Auto path: release only if this push changed the version. A manual
          # run (workflow_dispatch) forces a release of whatever's committed now.
          release=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release=true
          else
            git show HEAD~1:package.json > prev.json 2>/dev/null || echo '{}' > prev.json
            prev=$(node -p "require('./prev.json').version || ''")
            rm -f prev.json
            if [ "$cur" != "$prev" ]; then release=true; fi
          fi

          if [ "$release" != "true" ]; then
            echo "No version change — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — skipping (bump the version to release)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged ${tag}."
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: presik-linux-x64
          - os: macos-latest
            asset: presik-macos-arm64
          - os: windows-latest
            asset: presik-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # the triggering commit == the tagged version
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - run: npm run smoke # never ship a binary that doesn't serve
      - name: Name the binary per platform
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then cp dist/presik.exe "${{ matrix.asset }}.exe"; else cp dist/presik "${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*
          if-no-files-found: error
      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.gate.outputs.tag }}" --title "${{ needs.gate.outputs.tag }}" --generate-notes 2>/dev/null || true
          gh release upload "${{ needs.gate.outputs.tag }}" ${{ matrix.asset }}* --clobber

  # Publish the npm package (the source that runs via `npx presik`) to GitHub
  # Packages — only once every platform's binary has built and smoke-passed.
  # package.json keeps `private: true` as a guard against an accidental npmjs
  # publish; here we drop it and scope the name to the owner, which GitHub
  # Packages requires. The binaries themselves go to the Release above.
  publish-package:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
      - name: Prepare packages for GitHub Packages
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          version="${TAG#v}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Main package: drop the private guard, scope the name to the owner
          # (GitHub Packages requires it), and match the tag version.
          npm pkg delete private
          npm pkg set name="@${owner}/presik"
          npm version --no-git-tag-version --allow-same-version "$version"
          # Widget SDK (packages/widget-sdk) is already scoped + publishConfig'd;
          # just line its version up with the release.
          ( cd packages/widget-sdk && npm version --no-git-tag-version --allow-same-version "$version" )
      - name: Publish presik
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the widget SDK
        run: npm publish
        working-directory: packages/widget-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the same two packages to the PUBLIC npmjs registry, so `npx presik`
  # and `npm i presik` work for people with no GitHub Packages auth configured.
  # Runs alongside publish-package (GitHub Packages) — both registries get every
  # release. Both packages go out UNSCOPED here — `presik` and `presik-widget`
  # — whereas GitHub Packages requires the owner scope (`@igorrkurr/…`). Same
  # code, two names per package; each job renames for its own registry.
  #
  # Auth is npm Trusted Publishing (OIDC) — no token, by necessity: npm
  # permanently revoked classic tokens on 2025-12-09, and granular write tokens
  # now expire after 90 days, which is a rotation treadmill for a release
  # pipeline. OIDC mints a short-lived, job-scoped credential instead, so there
  # is no secret to leak or rotate.
  #
  # ONE-TIME BOOTSTRAP (both packages are new on npmjs). npm will not let you
  # attach a trusted publisher to a package that doesn't exist yet, so OIDC
  # cannot perform a package's FIRST publish. Chicken-and-egg; break it once:
  #
  #   1. npmjs.com → Access Tokens → Granular, write, scope "All packages".
  #   2. Locally, from a clean checkout:
  #        npm pkg delete private && npm publish --access public
  #        cd packages/widget-sdk
  #        npm pkg set name=presik-widget
  #        npm pkg delete publishConfig.registry && npm publish --access public
  #      (discard those package.json edits afterwards — CI redoes them itself)
  #   3. For EACH package on npmjs.com → Settings → Trusted Publisher →
  #      GitHub Actions:  repository igorrKurr/presik,  workflow release.yml
  #   4. Delete the token from step 1. Nothing needs it again.
  #
  # Until step 3 is done this job fails — deliberately loudly, and harmlessly:
  # the binaries and GitHub Packages have already shipped by the time it runs.
  publish-npmjs:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for publish rights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      # OIDC publishing needs npm >= 11.5.1; some Node 24.x lines still bundle an
      # older 11.x, so pin the floor explicitly rather than hope.
      - name: Ensure an OIDC-capable npm
        run: |
          set -euo pipefail
          need=11.5.1
          have=$(npm -v)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have < $need — upgrading."
            npm install -g npm@latest
          fi
          npm -v
      - name: Prepare packages for npmjs
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Drop the private guard (it exists to stop an ACCIDENTAL publish; this
          # one is deliberate). Name stays `presik`.
          npm pkg delete private
          npm version --no-git-tag-version --allow-same-version "$version"
          # The widget SDK is checked in as @igorrkurr/presik-widget because
          # GitHub Packages demands the repo owner's scope. npmjs has no such
          # rule, and the owner's npm username is `ihorrkurr` (not `igorrkurr`),
          # so that scope isn't even ours to publish under here — go unscoped,
          # pairing with the unscoped `presik`. Also clear the publishConfig
          # registry pin so this lands on npmjs.
          cd packages/widget-sdk
          npm pkg set name=presik-widget
          npm pkg delete publishConfig.registry
          npm version --no-git-tag-version --allow-same-version "$version"
      # No NODE_AUTH_TOKEN on either publish — OIDC covers auth. Provenance
      # attestations are generated automatically (public repo + public package),
      # so --provenance is not passed either.
      - name: Publish presik
        run: npm publish --access public
      - name: Publish the widget SDK
        run: npm publish --access public
        working-directory: packages/widget-sdk
