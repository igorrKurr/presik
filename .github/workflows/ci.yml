name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite is flagless from 24; keep 22.x in the matrix to catch the
        # --experimental-sqlite re-exec path, and cover Windows for the Marp/
        # path fixes.
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
