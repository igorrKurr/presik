<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides</title>
<!-- presik — PDF deck viewer -->
<!-- Renders deck.pdf as slides (pdf.js) and interleaves the quiz steps placed
     by each question's "slide" field. presik owns navigation, so arrow keys
     drive the pages AND the quiz in lockstep — same as the Marp path — and it's
     one fullscreen surface for the projector or a Zoom screen-share. Opened
     with ?key= it controls; without, it's a view-only follower. -->
<link rel="stylesheet" href="/embed.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b1118; color: #f1f5f9; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #pdf { display: none; box-shadow: 0 0 40px rgba(0,0,0,.5); }
  #quiz { display: none; position: absolute; inset: 0; }
  #quiz .quiz-slide { background: #0b1118; }
  #joinchip { position: absolute; right: 20px; bottom: 18px; display: none; align-items: center; gap: 10px;
    background: rgba(11,17,24,.82); border: 1px solid #223041; border-radius: 10px; padding: 8px 12px; }
  #joinchip img { width: 74px; height: 74px; background: #fff; border-radius: 6px; padding: 4px; display: block; }
  #joinchip span { font-size: 13px; color: #94a3b8; }
  #hud { position: fixed; left: 16px; bottom: 14px; font-size: 13px; color: #64748b; opacity: .55; }
  #msg { position: absolute; color: #94a3b8; font-size: 20px; }
</style>
<!--PRESIK_CONFIG-->
</head>
<body>
  <div id="stage">
    <canvas id="pdf"></canvas>
    <div id="quiz"></div>
    <div id="joinchip"></div>
    <div id="msg">Loading deck…</div>
  </div>
  <div id="hud"></div>
<script type="module">
  import * as pdfjsLib from '/vendor/pdf.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.mjs';

  const CFG = window.__PRESIK__ || {};
  const Q = CFG.questions || [];

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('pdf');
  const ctx = canvas.getContext('2d');
  const quizEl = document.getElementById('quiz');
  const chip = document.getElementById('joinchip');
  const msg = document.getElementById('msg');
  const hud = document.getElementById('hud');

  let last = null;      // latest /api/stream snapshot (counts, reveal, joinUrl)
  let steps = [];       // combined sequence of pages + quiz steps
  let step = 0;
  let pdf = null;
  let renderToken = 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function joinUrl() { return (last && last.joinUrl) || ''; }
  function bar(pct) { return '<div class="quiz-bar"><div class="quiz-bar-fill" style="width:' + pct + '%"></div></div>'; }
  function joinSlot(size) {
    return '<div class="quiz-join quiz-join-' + size + '"><img src="/qr.svg" alt="Join QR code">' +
      (size === 'lg' ? '<div class="quiz-join-title">Scan to join</div>' : '') +
      (joinUrl() ? '<div class="quiz-join-url">' + esc(joinUrl()) + '</div>' : '') + '</div>';
  }

  // ---- quiz rendering (mirrors the Marp embed; reuses embed.css) ----
  function questionView(q, st) {
    let h = '<div class="quiz-slide quiz-question-slide"><div class="quiz-kicker">Question</div>';
    h += '<div class="quiz-question-text">' + esc(q.text) + '</div>';
    if (q.note) h += '<div class="quiz-note">' + esc(q.note) + '</div>';
    if (q.type === 'choice' && q.options.length)
      h += '<ul class="quiz-options-list">' + q.options.map(o => '<li>' + esc(o.text) + '</li>').join('') + '</ul>';
    h += '<div class="quiz-cta"><div class="quiz-cta-title">Answer on your phone</div>' +
      '<div class="quiz-progress">Answered: ' + (st.answered || 0) + ' · connected: ' + (st.connected || 0) + '</div></div>';
    return h + joinSlot('sm') + '</div>';
  }
  function revealView(q, st) {
    const revealed = last && last.revealed && last.question && last.question.id === q.id;
    let h = '<div class="quiz-slide quiz-reveal-slide"><div class="quiz-kicker">Result</div>';
    h += '<div class="quiz-question-text">' + esc(q.text) + '</div>';
    const kind = q.type === 'widget' ? (q.answer || 'choice') : q.type; // a widget reveals as its declared kind
    if (!revealed) {
      h += '<div class="quiz-cta quiz-muted">Revealing…</div>';
    } else if (kind === 'choice') {
      const counts = st.counts || {}, total = Object.keys(counts).reduce((a, k) => a + counts[k], 0) || 1;
      const correct = (last.question.correct) || [];
      h += '<div class="quiz-opts">' + q.options.map(o => {
        const c = counts[o.id] || 0, pct = Math.round((c / total) * 100), ok = correct.indexOf(o.id) >= 0;
        return '<div class="quiz-opt' + (ok ? ' quiz-correct' : '') + '"><div class="quiz-opt-row"><span>' +
          esc(o.text) + '</span><span>' + c + ' · ' + pct + '%</span></div>' + bar(pct) + '</div>';
      }).join('') + '</div>';
    } else if (kind === 'scale') {
      const counts = st.counts || {}, keys = Object.keys(counts);
      const maxc = Math.max.apply(null, [1].concat(keys.map(k => counts[k])));
      h += '<div class="quiz-opts">' + keys.map(k => {
        const c = counts[k], pct = Math.round((c / maxc) * 100);
        return '<div class="quiz-opt"><div class="quiz-opt-row"><span>' + esc(k) + '</span><span>' + c + '</span></div>' + bar(pct) + '</div>';
      }).join('') + '</div>' + (st.avg ? '<div class="quiz-note">Average: ' + esc(st.avg) + '</div>' : '');
    } else {
      const texts = st.texts || [];
      h += '<div class="quiz-texts">' + (texts.length
        ? texts.slice(0, 14).map(t => '<div class="quiz-text-item">' + esc(t) + '</div>').join('')
        : '<div class="quiz-muted">No answers yet</div>') + '</div>';
    }
    if (revealed && last.question.explain) h += '<div class="quiz-explain">' + esc(last.question.explain) + '</div>';
    return h + joinSlot('sm') + '</div>';
  }

  // ---- PDF page rendering ----
  async function renderPage(p) {
    const token = ++renderToken;
    const page = await pdf.getPage(p);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const v0 = page.getViewport({ scale: 1 });
    const scale = Math.min(window.innerWidth / v0.width, window.innerHeight / v0.height);
    const vp = page.getViewport({ scale: scale * dpr });
    if (token !== renderToken) return; // a newer navigation superseded this render
    canvas.width = vp.width; canvas.height = vp.height;
    canvas.style.width = (vp.width / dpr) + 'px';
    canvas.style.height = (vp.height / dpr) + 'px';
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
  }

  function render() {
    const s = steps[step];
    if (!s) return;
    if (s.t === 'page') {
      canvas.style.display = 'block';
      quizEl.style.display = 'none';
      chip.style.display = 'flex';
      chip.innerHTML = '<img src="/qr.svg" alt="Join">' + (joinUrl() ? '<span>' + esc(joinUrl()) + '</span>' : '');
      renderPage(s.page);
    } else {
      canvas.style.display = 'none';
      chip.style.display = 'none';
      quizEl.style.display = 'block';
      const q = Q[s.qi];
      const st = (last && last.question && last.question.id === q.id && last.stats) || {};
      quizEl.innerHTML = s.t === 'question' ? questionView(q, st) : revealView(q, st);
    }
    hud.textContent = s.t === 'page' ? ('Slide ' + s.page + ' / ' + pdf.numPages)
      : (s.t === 'question' ? 'Question' : 'Result') + ' · ' + Q[s.qi].id;
  }

  // ---- navigation → drives the same /api/control as the Marp deck ----
  function control(body) {
    fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ key: CFG.key }, body)) }).catch(() => {});
  }
  function fireControl() {
    if (!CFG.isHost || !CFG.key) return;     // no key → view-only follower, controls nothing
    const s = steps[step];
    if (s.t === 'question') control({ action: 'goto', to: s.qi });
    else if (s.t === 'reveal') control({ action: 'reveal', to: s.qi });
    // page steps leave the quiz state as-is (like a Marp content slide)
  }
  function go(n) {
    step = Math.max(0, Math.min(steps.length - 1, n));
    fireControl();
    render();
  }

  async function init() {
    try {
      pdf = await pdfjsLib.getDocument({ url: CFG.pdf }).promise;
    } catch (e) {
      msg.textContent = 'Could not load the PDF deck.';
      return;
    }
    const bySlide = {};
    Q.forEach((q, i) => { if (q.slide) (bySlide[q.slide] = bySlide[q.slide] || []).push(i); });
    steps = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      steps.push({ t: 'page', page: p });
      (bySlide[p] || []).forEach(i => { steps.push({ t: 'question', qi: i }); steps.push({ t: 'reveal', qi: i }); });
    }
    msg.style.display = 'none';
    go(0);
  }

  const es = new EventSource('/api/stream?embed=1'); // keyless: audience visibility, and not counted as a student
  es.onmessage = e => { try { last = JSON.parse(e.data); } catch (_) { return; } if (steps[step] && steps[step].t !== 'page') render(); };

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(step + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(step - 1); }
    else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  });
  stage.addEventListener('click', () => go(step + 1));
  window.addEventListener('resize', () => { if (steps[step] && steps[step].t === 'page') renderPage(steps[step].page); });

  init();
</script>
</body>
</html>
