<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — presenter</title>
<!-- presik -->
<!-- Stand-alone projector view for a questions-only session (no deck). Shows
     the join QR, the live answer counter, and the distribution after reveal.
     For a session WITH a deck (deck.pdf or deck.marp.md), use /slides instead —
     it renders your slides with the quiz interleaved. View-only. -->
<link rel="stylesheet" href="/embed.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b1118; color: #f1f5f9;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #live { height: 100vh; padding: 40px; box-sizing: border-box; }
  .conn { height: 100%; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 22px; }
</style>
</head>
<body>
  <div id="live"><div class="conn">Connecting…</div></div>
<script>
  var QR_SRC = location.origin + '/qr.svg';
  var LAST = null;
  var liveEl = document.getElementById('live');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function joinUrl() { return (LAST && LAST.joinUrl) || ''; }
  function bar(pct) { return '<div class="quiz-bar"><div class="quiz-bar-fill" style="width:' + pct + '%"></div></div>'; }
  function joinBlock(size) {
    return '<div class="quiz-join quiz-join-' + size + '"><img src="' + QR_SRC + '" alt="Join QR code">' +
      (size === 'lg' ? '<div class="quiz-join-title">Scan to join</div>' : '') +
      (joinUrl() ? '<div class="quiz-join-url">' + esc(joinUrl()) + '</div>' : '') + '</div>';
  }

  function build(s) {
    if (!s || !s.question) {
      return '<div class="quiz-slide quiz-join-slide">' + joinBlock('lg') +
        '<div class="quiz-join-note">Scan to join · keep this page open until the end</div></div>';
    }
    var q = s.question, st = s.stats || {};
    if (!s.revealed) {
      var h = '<div class="quiz-slide quiz-question-slide"><div class="quiz-kicker">Question ' + (s.index + 1) + ' / ' + s.total + '</div>';
      h += '<div class="quiz-question-text">' + esc(q.text) + '</div>';
      if (q.note) h += '<div class="quiz-note">' + esc(q.note) + '</div>';
      if (q.type === 'choice' && q.options && q.options.length)
        h += '<ul class="quiz-options-list">' + q.options.map(function (o) { return '<li>' + esc(o.text) + '</li>'; }).join('') + '</ul>';
      h += '<div class="quiz-cta"><div class="quiz-cta-title">Answer on your phone</div>' +
        '<div class="quiz-progress">Answered: ' + (st.answered || 0) + ' · connected: ' + (st.connected || 0) + '</div></div>';
      return h + joinBlock('sm') + '</div>';
    }
    var r = '<div class="quiz-slide quiz-reveal-slide"><div class="quiz-kicker">Result</div>';
    r += '<div class="quiz-question-text">' + esc(q.text) + '</div>';
    if (q.type === 'choice') {
      var counts = st.counts || {}, total = Object.keys(counts).reduce(function (a, k) { return a + counts[k]; }, 0) || 1;
      var correct = q.correct || [];
      r += '<div class="quiz-opts">' + (q.options || []).map(function (o) {
        var c = counts[o.id] || 0, pct = Math.round((c / total) * 100), ok = correct.indexOf(o.id) >= 0;
        return '<div class="quiz-opt' + (ok ? ' quiz-correct' : '') + '"><div class="quiz-opt-row"><span>' +
          esc(o.text) + '</span><span>' + c + ' · ' + pct + '%</span></div>' + bar(pct) + '</div>';
      }).join('') + '</div>';
    } else if (q.type === 'scale') {
      var c2 = st.counts || {}, keys = Object.keys(c2);
      var maxc = Math.max.apply(null, [1].concat(keys.map(function (k) { return c2[k]; })));
      r += '<div class="quiz-opts">' + keys.map(function (k) {
        var c = c2[k], pct = Math.round((c / maxc) * 100);
        return '<div class="quiz-opt"><div class="quiz-opt-row"><span>' + esc(k) + '</span><span>' + c + '</span></div>' + bar(pct) + '</div>';
      }).join('') + '</div>' + (st.avg ? '<div class="quiz-note">Average: ' + esc(st.avg) + '</div>' : '');
    } else {
      var texts = st.texts || [];
      r += '<div class="quiz-texts">' + (texts.length
        ? texts.slice(0, 14).map(function (t) { return '<div class="quiz-text-item">' + esc(t) + '</div>'; }).join('')
        : '<div class="quiz-muted">No answers yet</div>') + '</div>';
    }
    if (q.explain) r += '<div class="quiz-explain">' + esc(q.explain) + '</div>';
    return r + joinBlock('sm') + '</div>';
  }

  // Live state over SSE, falling back to polling /api/poll when the stream stays
  // silent — some proxies (Cloudflare quick tunnels, i.e. --tunnel) buffer it.
  function live(qs, onData, onErr) {
    var got = false, last = '';
    var es = new EventSource('/api/stream' + qs);
    es.onmessage = function (e) { got = true; onData(e.data); };
    if (onErr) es.onerror = onErr;
    setTimeout(function () {
      if (got) return;
      es.close();
      (function poll() {
        fetch('/api/poll' + qs, { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
          .then(function (t) { if (t !== last) { last = t; onData(t); } }, onErr || function () {})
          .then(function () { setTimeout(poll, 1500); });
      })();
    }, 5000);
  }
  live('?embed=1',
    function (d) { try { LAST = JSON.parse(d); liveEl.innerHTML = build(LAST); } catch (_) {} },
    function () { if (!LAST) liveEl.innerHTML = '<div class="conn">Reconnecting…</div>'; });
</script>
</body>
</html>
