name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite is flagless from 24; keep 22.x in the matrix to catch the
        # --experimental-sqlite re-exec path, and cover Windows for the Marp/
        # path fixes.
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  # Build the single-file binary and smoke-test it on each OS, so a broken SEA
  # build or a missing embedded asset (e.g. deck.html / pdf.js) fails a PR
  # rather than surfacing only when a release tag is cut.
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
