<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — presenter</title>
<!-- presik -->
<!-- The projector-side "live layer" for non-Marp decks: shows the join QR, the
     live answer counter, and (after reveal) the distribution — the pieces your
     own PowerPoint/Keynote slide can't. Either full-screen on the projector, or
     popped out as an always-on-top Picture-in-Picture window that floats over a
     native slideshow. View-only: it follows revealed state, controls nothing. -->
<link rel="stylesheet" href="/embed.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b1118; color: #f1f5f9;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #stage { height: 100vh; }
  #live { height: 100%; padding: 40px; box-sizing: border-box; }
  #placeholder { height: 100%; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; color: #94a3b8; text-align: center; padding: 40px; }
  #pipBtn { position: fixed; top: 14px; right: 16px; z-index: 10; background: #1b2634;
    color: #f1f5f9; border: 1px solid #223041; border-radius: 8px; padding: 9px 14px;
    font-size: 14px; cursor: pointer; opacity: .55; }
  #pipBtn:hover { opacity: 1; }
  #pipBtn[hidden] { display: none; }
  .conn { height: 100%; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 22px; }
</style>
</head>
<body>
  <button id="pipBtn" hidden>⧉ Float over slides</button>
  <div id="stage">
    <div id="live"><div class="conn">Connecting…</div></div>
    <div id="placeholder">
      <div style="font-size:22px">Floating over your slides ↗</div>
      <div>Close the little window to bring this back into the tab.</div>
    </div>
  </div>
<script>
  var QR_SRC = location.origin + '/qr.svg';
  var LAST = null;
  var liveEl = document.getElementById('live');
  var placeholder = document.getElementById('placeholder');
  var pipBtn = document.getElementById('pipBtn');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function joinBlock(size) {
    var url = (LAST && LAST.joinUrl) || '';
    return '<div class="quiz-join quiz-join-' + size + '"><img src="' + QR_SRC + '" alt="Join QR code">' +
      (size === 'lg' ? '<div class="quiz-join-title">Scan to join</div>' : '') +
      (url ? '<div class="quiz-join-url">' + esc(url) + '</div>' : '') + '</div>';
  }
  function bar(pct) { return '<div class="quiz-bar"><div class="quiz-bar-fill" style="width:' + pct + '%"></div></div>'; }

  function buildHtml(s) {
    if (!s || !s.question) {
      return '<div class="quiz-slide quiz-join-slide">' + joinBlock('lg') +
        '<div class="quiz-join-note">Scan to join · keep this page open until the end</div></div>';
    }
    var q = s.question, st = s.stats || {};
    if (!s.revealed) {
      var h = '<div class="quiz-slide quiz-question-slide">';
      h += '<div class="quiz-kicker">Question ' + (s.index + 1) + ' / ' + s.total + '</div>';
      h += '<div class="quiz-question-text">' + esc(q.text) + '</div>';
      if (q.note) h += '<div class="quiz-note">' + esc(q.note) + '</div>';
      if (q.type === 'choice' && q.options && q.options.length)
        h += '<ul class="quiz-options-list">' + q.options.map(function (o) { return '<li>' + esc(o.text) + '</li>'; }).join('') + '</ul>';
      h += '<div class="quiz-cta"><div class="quiz-cta-title">Answer on your phone</div>' +
        '<div class="quiz-progress">Answered: ' + (st.answered || 0) + ' · connected: ' + (st.connected || 0) + '</div></div>';
      h += joinBlock('sm') + '</div>';
      return h;
    }
    var r = '<div class="quiz-slide quiz-reveal-slide"><div class="quiz-kicker">Result</div>';
    r += '<div class="quiz-question-text">' + esc(q.text) + '</div>';
    if (q.type === 'choice') {
      var counts = st.counts || {}, total = Object.keys(counts).reduce(function (a, k) { return a + counts[k]; }, 0) || 1;
      var correct = q.correct || [];
      r += '<div class="quiz-opts">' + (q.options || []).map(function (o) {
        var c = counts[o.id] || 0, pct = Math.round((c / total) * 100), ok = correct.indexOf(o.id) >= 0;
        return '<div class="quiz-opt' + (ok ? ' quiz-correct' : '') + '"><div class="quiz-opt-row"><span>' +
          esc(o.text) + '</span><span>' + c + ' · ' + pct + '%</span></div>' + bar(pct) + '</div>';
      }).join('') + '</div>';
    } else if (q.type === 'scale') {
      var counts2 = st.counts || {}, keys = Object.keys(counts2);
      var maxc = Math.max.apply(null, [1].concat(keys.map(function (k) { return counts2[k]; })));
      r += '<div class="quiz-opts">' + keys.map(function (k) {
        var c = counts2[k], pct = Math.round((c / maxc) * 100);
        return '<div class="quiz-opt"><div class="quiz-opt-row"><span>' + esc(k) + '</span><span>' + c + '</span></div>' + bar(pct) + '</div>';
      }).join('') + '</div>' + (st.avg ? '<div class="quiz-note">Average: ' + esc(st.avg) + '</div>' : '');
    } else if (q.type === 'text') {
      var texts = st.texts || [];
      r += '<div class="quiz-texts">' + (texts.length
        ? texts.slice(0, 14).map(function (t) { return '<div class="quiz-text-item">' + esc(t) + '</div>'; }).join('')
        : '<div class="quiz-muted">No answers yet</div>') + '</div>';
    }
    if (st.connected > st.answered)
      r += '<div class="quiz-progress">Still answering: ' + (st.connected - st.answered) + ' of ' + st.connected + ' connected</div>';
    if (q.explain) r += '<div class="quiz-explain">' + esc(q.explain) + '</div>';
    r += joinBlock('sm') + '</div>';
    return r;
  }

  function render(s) { liveEl.innerHTML = buildHtml(s); }

  // embed=1 → this projector view isn't a student, so it doesn't inflate the
  // "connected" count; no ?key= → it only ever sees what students see (no
  // distribution/correct answer until the teacher reveals).
  var es = new EventSource('/api/stream?embed=1');
  es.onmessage = function (e) { try { LAST = JSON.parse(e.data); render(LAST); } catch (_) {} };
  es.onerror = function () { if (!LAST) liveEl.innerHTML = '<div class="conn">Reconnecting…</div>'; };

  // ---- Document Picture-in-Picture: an always-on-top window that floats over
  // a native fullscreen Keynote/PowerPoint slideshow on the same machine. ----
  var PIP_CSS =
    'html,body{margin:0;height:100%;background:#0b1118;color:#f1f5f9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}' +
    '#live{height:100%;padding:14px;box-sizing:border-box;}' +
    '.quiz-slide{gap:8px;}.quiz-kicker{font-size:12px;}.quiz-question-text{font-size:17px;max-width:none;}' +
    '.quiz-note{font-size:12px;}.quiz-options-list{font-size:13px;gap:3px;}.quiz-cta-title{font-size:14px;}' +
    '.quiz-progress{font-size:12px;}.quiz-muted{font-size:13px;}.quiz-opt{font-size:13px;}.quiz-explain{font-size:12px;}' +
    '.quiz-join-lg img{width:150px;height:150px;}.quiz-join-title{font-size:15px;}.quiz-join-url{font-size:11px;}' +
    '.quiz-join-note{font-size:12px;}.quiz-texts{max-height:60vh;}.quiz-text-item{font-size:12px;}';

  var pipWin = null;
  if ('documentPictureInPicture' in window) {
    pipBtn.hidden = false;
    pipBtn.onclick = async function () {
      if (pipWin) { pipWin.close(); return; }
      try {
        pipWin = await window.documentPictureInPicture.requestWindow({ width: 360, height: 430 });
        var link = pipWin.document.createElement('link');
        link.rel = 'stylesheet'; link.href = location.origin + '/embed.css';
        pipWin.document.head.appendChild(link);
        var style = pipWin.document.createElement('style');
        style.textContent = PIP_CSS; pipWin.document.head.appendChild(style);
        pipWin.document.body.appendChild(liveEl); // adopt the live element; render() keeps updating it
        placeholder.style.display = 'flex';
        pipBtn.textContent = '⧉ Return to tab';
        pipWin.addEventListener('pagehide', function () {
          document.getElementById('stage').insertBefore(liveEl, placeholder);
          placeholder.style.display = 'none';
          pipBtn.textContent = '⧉ Float over slides';
          pipWin = null;
        });
      } catch (_) { pipWin = null; }
    };
  }
</script>
</body>
</html>
