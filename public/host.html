<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — teacher</title>
<!-- presik -->
<style>
  :root { --bg:#10161f; --panel:#1b2634; --panel2:#223041; --txt:#f1f5f9;
          --muted:#94a3b8; --cyan:#38bdf8; --green:#4ade80; --red:#f87171; --amber:#f5a524; }
  * { box-sizing:border-box; }
  body { margin:0; padding:30px 42px 110px; background:var(--bg); color:var(--txt);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .top { display:flex; justify-content:space-between; color:var(--muted); font-size:17px; }
  h1 { font-size:36px; line-height:1.25; margin:12px 0 6px; }
  .note { color:var(--muted); font-size:19px; margin-bottom:18px; }
  .split { display:flex; gap:34px; align-items:flex-start; }
  .main { flex:1; min-width:0; }
  .side { width:240px; flex:none; text-align:center; }
  .side img { width:100%; background:#fff; border-radius:10px; padding:8px; }
  .side .url { margin-top:10px; font-size:14px; color:var(--cyan); word-break:break-all; }
  .side .cap { margin-top:6px; font-size:13px; color:var(--muted); }
  .bar { margin-bottom:13px; }
  .barhead { display:flex; justify-content:space-between; font-size:20px; margin-bottom:5px; gap:14px; }
  .barhead span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track { height:32px; background:var(--panel); border-radius:6px; overflow:hidden; }
  .fill { height:100%; background:var(--panel2); transition:width .35s ease; }
  .bar.correct .fill { background:var(--green); }
  .bar.correct .barhead { color:var(--green); }
  .bar.lead .fill { background:var(--cyan); }
  .texts { display:flex; flex-wrap:wrap; gap:9px; margin-top:12px; }
  .texts div { background:var(--panel); border:1px solid var(--panel2); border-radius:8px;
               padding:9px 13px; font-size:15px; max-width:380px; }
  .count { font-size:20px; color:var(--muted); margin-top:16px; }
  .count b { color:var(--txt); }
  .avg { color:var(--cyan); }
  .hint { margin-top:18px; padding:15px 18px; border-radius:8px; background:var(--panel);
          border:1px solid var(--amber); color:var(--amber); font-size:17px; line-height:1.5; }
  .ctl { position:fixed; bottom:0; left:0; right:0; padding:13px 42px; background:#0b1118;
         border-top:1px solid var(--panel2); display:flex; gap:9px; align-items:center; }
  .ctl button { background:var(--panel); color:var(--txt); border:1px solid var(--panel2);
                border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; }
  .ctl button.primary { background:var(--cyan); color:#0b1118; border-color:var(--cyan);
                        font-weight:600; min-width:160px; }
  .ctl button:disabled { opacity:.4; cursor:default; }
  .ctl .auto { color:var(--muted); font-size:14px; display:flex; align-items:center; gap:7px; cursor:pointer; }
  .ctl .auto input { width:16px; height:16px; cursor:pointer; }
  .ctl .note { color:var(--muted); font-size:14px; }
  .ctl .danger { margin-left:auto; }
  .wait { text-align:center; padding:70px 0; color:var(--muted); font-size:22px; line-height:1.6; }
</style>
</head>
<body>
  <div class="top"><span id="title"></span><span id="pos"></span></div>
  <div class="split">
    <div class="main" id="app"><div class="wait">The quiz hasn't started yet.</div></div>
    <div class="side">
      <img id="qr" src="/qr.svg" alt="QR code">
      <div class="url" id="url"></div>
      <div class="cap">Scan or type in the address</div>
      <div class="cap" id="ver" style="margin-top:14px;opacity:.5"></div>
    </div>
  </div>
  <div class="ctl">
    <button id="backBtn" title="Space/→ advance · ←/PageUp back">◀ Back</button>
    <button id="advBtn" class="primary">▶ Show Q1</button>
    <label class="auto"><input type="checkbox" id="autoRev"> Auto-reveal when everyone's answered</label>
    <span class="note" id="ctlHint"></span>
    <button class="danger" id="clearBtn">Clear answers</button>
  </div>
<script>
  const KEY = new URL(location.href).searchParams.get('key');
  const ctl = (body) => fetch('/api/control', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ key: KEY }, body))
  });

  // /host is the control surface — open it wherever you like. One primary
  // button walks the natural rhythm (show → reveal → next question), composed
  // from the same /api/control the Marp slides use, so a native PowerPoint /
  // Keynote deck (driven by its own clicker) gets a one-tap quiz control.
  let S = null;
  const advBtn = document.getElementById('advBtn');
  const backBtn = document.getElementById('backBtn');
  const autoRev = document.getElementById('autoRev');
  const ctlHint = document.getElementById('ctlHint');

  function advancePlan(s) {
    if (!s || !s.total) return null;
    const last = s.total - 1;
    if (s.index < 0) return { label: '▶ Show Q1', body: { action: 'goto', to: 0 } };
    if (!s.revealed) return { label: '👁 Reveal', body: { action: 'reveal', to: s.index } };
    if (s.index < last) return { label: '▶ Show Q' + (s.index + 2), body: { action: 'goto', to: s.index + 1 } };
    return { label: '✓ Done', body: null };
  }
  function backPlan(s) {
    if (!s) return null;
    if (s.revealed) return { action: 'goto', to: s.index };       // hide the result (unreveal in place)
    if (s.index > 0) return { action: 'reveal', to: s.index - 1 }; // step back to the previous, revealed
    if (s.index === 0) return { action: 'prev' };                  // back to the idle "not started" state
    return null;
  }
  function doAdvance() { const p = advancePlan(S); if (p && p.body) ctl(p.body); }
  function doBack() { const b = backPlan(S); if (b) ctl(b); }

  advBtn.onclick = doAdvance;
  backBtn.onclick = doBack;
  autoRev.onchange = () => ctl({ action: 'auto', autoReveal: autoRev.checked });
  document.getElementById('clearBtn').onclick = () => { if (confirm('Clear answers for this question?')) ctl({ action: 'clear' }); };

  // Space / → (and PageDown, which most presentation clickers send) = advance;
  // ← / PageUp = back. So any device with /host focused — including a spare
  // Bluetooth clicker — drives the quiz with the same forward gesture as slides.
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); doAdvance(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); doBack(); }
  });

  function updateControls(s) {
    const p = advancePlan(s);
    advBtn.textContent = p ? p.label : '▶ Show Q1';
    advBtn.disabled = !p || !p.body;
    backBtn.disabled = !backPlan(s);
    if (document.activeElement !== autoRev) autoRev.checked = !!s.autoReveal;
    ctlHint.textContent = s.autoReveal ? 'reveals itself once all are in' : '';
  }

  const app = document.getElementById('app');

  // Everything below flows through innerHTML; escape author text and student
  // free-text answers so markup can't be injected and plain "<", "&" render.
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function bars(items, revealed, correct) {
    const total = items.reduce((a, i) => a + i.n, 0);
    const max = Math.max(0, ...items.map((i) => i.n));
    return items.map((i) => {
      const pct = total ? Math.round((i.n / total) * 100) : 0;
      const isC = revealed && correct && correct.includes(i.id);
      const isL = !revealed && i.n === max && i.n > 0;
      return '<div class="bar' + (isC ? ' correct' : '') + (isL ? ' lead' : '') + '">' +
        '<div class="barhead"><span>' + esc(i.text) + '</span><span>' + (total ? i.n + ' · ' + pct + '%' : '') + '</span></div>' +
        '<div class="track"><div class="fill" style="width:' + (total ? (i.n / total) * 100 : 0) + '%"></div></div></div>';
    }).join('');
  }

  function render(s) {
    S = s;
    updateControls(s);
    document.getElementById('title').textContent = s.title;
    document.getElementById('pos').textContent = s.index >= 0 ? (s.index + 1) + ' / ' + s.total : '';
    document.getElementById('url').textContent = s.joinUrl || '';
    // re-fetch the QR when the join URL changes (LAN → --tunnel); same src would stay cached
    const qrSrc = '/qr.svg?u=' + encodeURIComponent(s.joinUrl || '');
    if (document.getElementById('qr').getAttribute('src') !== qrSrc) document.getElementById('qr').setAttribute('src', qrSrc);
    document.getElementById('ver').textContent = 'v' + (s.version || '?');

    if (!s.question) {
      app.innerHTML = '<div class="wait">The quiz hasn\'t started yet.<br>' +
        '<span style="font-size:17px">Students can already connect. Control happens from the slides.</span></div>';
      return;
    }
    const q = s.question, st = s.stats || {};
    let h = '<h1>' + esc(q.text) + '</h1>';
    if (q.note) h += '<div class="note">' + esc(q.note) + '</div>';

    if (q.type === 'text') {
      if (st.texts && st.texts.length && s.revealed) {
        h += '<div class="texts">' + st.texts.map((t) => '<div>' + esc(t) + '</div>').join('') + '</div>';
      } else {
        h += '<div class="note">Answers will show once revealed from the slides.</div>';
      }
    } else if (q.type === 'scale') {
      const items = [];
      for (let i = q.min; i <= q.max; i++) items.push({ id: String(i), text: String(i), n: (st.counts || {})[i] || 0 });
      h += bars(items, s.revealed, null);
      if (st.avg) h += '<div class="count">Average: <b class="avg">' + esc(st.avg) + '</b></div>';
    } else {
      h += bars(q.options.map((o) => ({ id: o.id, text: o.text, n: (st.counts || {})[o.id] || 0 })), s.revealed, q.correct);
    }
    h += '<div class="count">Answered: <b>' + (st.answered || 0) + '</b> of ' + (st.connected || 0) + ' connected</div>';
    if (q.hint) h += '<div class="hint"><b>Where to go next:</b> ' + esc(q.hint) + '</div>';
    app.innerHTML = h;
  }

  // Live state over SSE, falling back to polling /api/poll when the stream stays
  // silent — some proxies (Cloudflare quick tunnels, i.e. --tunnel) buffer it.
  function live(qs, onData, onErr) {
    var got = false, last = '';
    var es = new EventSource('/api/stream' + qs);
    es.onmessage = function (e) { got = true; onData(e.data); };
    if (onErr) es.onerror = onErr;
    setTimeout(function () {
      if (got) return;
      es.close();
      (function poll() {
        fetch('/api/poll' + qs, { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
          .then(function (t) { if (t !== last) { last = t; onData(t); } }, onErr || function () {})
          .then(function () { setTimeout(poll, 1500); });
      })();
    }, 5000);
  }
  live('?key=' + encodeURIComponent(KEY), (d) => render(JSON.parse(d)));
</script>
</body>
</html>
