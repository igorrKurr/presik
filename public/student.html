<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<!-- presik -->
<style>
  :root { --bg:#10161f; --panel:#1b2634; --panel2:#223041; --txt:#f1f5f9;
          --muted:#94a3b8; --cyan:#38bdf8; --green:#4ade80; --red:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--txt);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-text-size-adjust:100%; }
  .wrap { max-width:540px; margin:0 auto; }
  .meta { color:var(--muted); font-size:14px; margin-bottom:12px; }
  h1 { font-size:22px; line-height:1.35; margin:0 0 6px; }
  .note { color:var(--muted); font-size:15px; margin-bottom:16px; }
  button.opt { display:block; width:100%; text-align:left; background:var(--panel); color:var(--txt);
    border:1px solid var(--panel2); border-radius:10px; padding:16px 18px; margin-bottom:10px;
    font-size:17px; line-height:1.4; cursor:pointer; }
  button.opt.picked { border-color:var(--cyan); background:var(--panel2); }
  button.opt.correct { border-color:var(--green); }
  button.opt.wrong { border-color:var(--red); opacity:.6; }
  .tag { font-size:13px; color:var(--muted); margin-left:6px; }
  .scale { display:flex; gap:8px; }
  .scale button { flex:1; padding:20px 0; font-size:20px; background:var(--panel); color:var(--txt);
    border:1px solid var(--panel2); border-radius:10px; }
  .scale button.picked { border-color:var(--cyan); background:var(--panel2); }
  textarea { width:100%; min-height:120px; background:var(--panel); color:var(--txt);
    border:1px solid var(--panel2); border-radius:10px; padding:14px; font-size:16px;
    font-family:inherit; resize:vertical; }
  .send { width:100%; margin-top:10px; padding:15px; border-radius:10px; background:var(--cyan);
    color:#0b1118; border:0; font-size:17px; font-weight:600; }
  .status { margin-top:14px; padding:13px; border-radius:10px; background:var(--panel); font-size:15px; }
  .status.ok { border:1px solid var(--green); }
  .explain { margin-top:14px; padding:14px; border-radius:10px; background:var(--panel);
    border:1px solid var(--panel2); font-size:15px; line-height:1.5; color:var(--muted); }
  .wait { text-align:center; color:var(--muted); padding:60px 0; font-size:17px; line-height:1.6; }
  iframe.widget { width:100%; border:1px solid var(--panel2); border-radius:12px;
    background:var(--panel); display:block; margin-top:4px; }
  .widget-status { margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="meta" id="meta"></div>
  <div id="app"><div class="wait">Waiting for it to start…</div></div>
</div>
<script>
  let cid = localStorage.getItem('cid');
  if (!cid) { cid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('cid', cid); }

  const app = document.getElementById('app');
  const meta = document.getElementById('meta');
  const picked = {};
  let lastQid = null;
  let lastState = null;      // latest /api/stream snapshot — the widget bridge reads it
  let widgetMounted = null;  // qid whose iframe is currently mounted (mount once, never rebuild)

  // Question/option/explain text is author-written, but it still goes through
  // innerHTML — so escape it, both to be safe and so ordinary characters like
  // "3 < 5" or "a & b" render literally instead of breaking the markup.
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function send(qid, value) {
    picked[qid] = value;
    fetch('/api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qid, value, clientId: cid }) }).catch(() => {});
  }

  function render(s) {
    lastState = s;
    meta.textContent = s.index >= 0 ? s.title + ' · ' + (s.index + 1) + ' / ' + s.total : s.title;
    if (!s.question) {
      app.innerHTML = '<div class="wait">Waiting for it to start…<br><span style="font-size:14px">Keep this page open.</span></div>';
      lastQid = null; widgetMounted = null; return;
    }
    const q = s.question;
    if (q.id !== lastQid) { lastQid = q.id; widgetMounted = null; app.innerHTML = ''; }
    const my = picked[q.id];

    // A widget renders its own interactive front-end in a sandboxed iframe. It
    // must survive every stream tick, so it's mounted once and thereafter only
    // *told* about state changes over postMessage — never re-rendered here.
    if (q.type === 'widget') return renderWidget(q, s, my);

    let h = '<h1>' + esc(q.text) + '</h1>';
    if (q.note) h += '<div class="note">' + esc(q.note) + '</div>';

    if (q.type === 'text') {
      h += my === undefined
        ? '<textarea id="ta" placeholder="A few sentences in your own words"></textarea><button class="send" id="go">Send</button>'
        : '<div class="status ok">Answer sent. Thanks.</div>';
    } else if (q.type === 'scale') {
      h += '<div class="scale">';
      for (let i = q.min; i <= q.max; i++)
        h += '<button class="' + (String(my) === String(i) ? 'picked' : '') + '" data-v="' + i + '"' + (s.revealed ? ' disabled' : '') + '>' + i + '</button>';
      h += '</div>';
      if (my !== undefined) h += '<div class="status ok">Recorded.</div>';
    } else {
      q.options.forEach((o) => {
        let cls = 'opt';
        if (my === o.id) cls += ' picked';
        if (s.revealed && q.correct) {
          if (q.correct.includes(o.id)) cls += ' correct';
          else if (my === o.id) cls += ' wrong';
        }
        const tag = s.revealed && q.correct && q.correct.includes(o.id) ? '<span class="tag">correct</span>' : '';
        h += '<button class="' + cls + '" data-v="' + esc(o.id) + '"' + (s.revealed ? ' disabled' : '') + '>' + esc(o.text) + tag + '</button>';
      });
      if (!s.revealed) h += my === undefined
        ? '<div class="status">Pick an option.</div>'
        : '<div class="status ok">Recorded. You can change it until the result is shown.</div>';
    }
    if (s.revealed && q.explain) h += '<div class="explain">' + esc(q.explain) + '</div>';
    app.innerHTML = h;

    app.querySelectorAll('button[data-v]').forEach((b) => {
      b.onclick = () => { send(q.id, b.dataset.v); render(s); };
    });
    const go = document.getElementById('go');
    if (go) go.onclick = () => {
      const v = document.getElementById('ta').value.trim();
      if (v) { send(q.id, v); render(s); }
    };
  }

  // ---------------------------------------------------------------- widgets
  // The sandboxed game and this page speak a tiny postMessage protocol:
  //   game → page:  {presik:'ready'}            asks for its config + state
  //                 {presik:'answer', value}     reports the student's answer
  //   page → game:  {presik:'init', …}           config + current state, once
  //                 {presik:'state', …}           reveal/value updates thereafter
  // The value still goes through /api/answer, so validateAnswer gates it exactly
  // like a tapped button — untrusted game code can't post an illegal answer.
  function frame() { return document.getElementById('wframe'); }
  function postToWidget(msg) { const f = frame(); if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*'); }
  function widgetHeight(q) {
    const h = q.widget && q.widget.height;
    return Math.max(120, Math.min(Number(h) || 420, Math.round(window.innerHeight * 0.9)));
  }
  function widgetStateMsg(q, s, my) {
    return { presik: 'state', revealed: !!s.revealed, value: my == null ? null : my,
      correct: (s.revealed && q.correct) || null };
  }
  function updateWidgetStatus(q, s, my) {
    const el = document.getElementById('wstatus');
    if (!el) return;
    let h = my !== undefined
      ? '<div class="status ok">Answer recorded' + (s.revealed ? '.' : ' — you can still change it above.') + '</div>'
      : '<div class="status">Play through the question above — it sends your answer.</div>';
    if (s.revealed && q.explain) h += '<div class="explain">' + esc(q.explain) + '</div>';
    el.innerHTML = h;
  }
  function renderWidget(q, s, my) {
    if (widgetMounted !== q.id) {
      widgetMounted = q.id;
      let shell = '<h1>' + esc(q.text) + '</h1>';
      if (q.note) shell += '<div class="note">' + esc(q.note) + '</div>';
      // sandbox="allow-scripts" WITHOUT allow-same-origin → the game runs at a
      // null origin: no access to this page's DOM, storage, or the session.
      // An isolate widget needs a real origin to be cross-origin isolated
      // (SharedArrayBuffer / threads), so it also gets allow-same-origin — which
      // relaxes the sandbox, hence isolate is only for a front-end you control.
      var sandbox = q.widget && q.widget.isolate ? 'allow-scripts allow-same-origin' : 'allow-scripts';
      shell += '<iframe class="widget" id="wframe" title="Interactive question" ' +
        'sandbox="' + sandbox + '" style="height:' + widgetHeight(q) + 'px"></iframe>';
      shell += '<div class="widget-status" id="wstatus"></div>';
      app.innerHTML = shell;
      const f = frame();
      if (q.widget && q.widget.srcdoc != null) f.srcdoc = q.widget.srcdoc;
      else if (q.widget && q.widget.src) f.src = q.widget.src;
      else document.getElementById('wstatus').textContent = (q.widget && q.widget.error) || 'This question has no widget to load.';
    }
    updateWidgetStatus(q, s, my);
    postToWidget(widgetStateMsg(q, s, my)); // no-op until the game has loaded; the handshake re-sends
  }

  window.addEventListener('message', (e) => {
    const f = frame();
    if (!f || e.source !== f.contentWindow) return; // only the mounted widget may talk
    const d = e.data;
    if (!d || typeof d !== 'object' || typeof d.presik !== 'string') return;
    const q = lastState && lastState.question;
    if (!q || q.type !== 'widget') return;
    if (d.presik === 'ready') {
      // Carry the current state on init too, but keep presik:'init' — spreading
      // the whole state message (presik:'state') would clobber it and the game
      // would never initialize.
      const st = widgetStateMsg(q, lastState, picked[q.id]);
      postToWidget({ presik: 'init', answer: q.answer || 'choice', text: q.text, note: q.note || null,
        options: q.options || [], min: q.min, max: q.max, config: (q.widget && q.widget.config) || null,
        revealed: st.revealed, value: st.value, correct: st.correct });
    } else if (d.presik === 'answer' && d.value != null) {
      send(q.id, String(d.value).slice(0, 600));
      updateWidgetStatus(q, lastState, picked[q.id]);
    }
    // 'progress' or anything unrecognized: ignored
  });

  // Live state over SSE, falling back to polling /api/poll when the stream stays
  // silent — some proxies (Cloudflare quick tunnels, i.e. --tunnel) buffer it.
  function live(qs, onData, onErr) {
    var got = false, last = '';
    var es = new EventSource('/api/stream' + qs);
    es.onmessage = function (e) { got = true; onData(e.data); };
    if (onErr) es.onerror = onErr;
    setTimeout(function () {
      if (got) return;
      es.close();
      (function poll() {
        fetch('/api/poll' + qs, { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
          .then(function (t) { if (t !== last) { last = t; onData(t); } }, onErr || function () {})
          .then(function () { setTimeout(poll, 1500); });
      })();
    }, 5000);
  }
  live('?cid=' + encodeURIComponent(cid), (d) => render(JSON.parse(d)), () => { meta.textContent = 'Reconnecting…'; });
</script>
</body>
</html>
